<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Du entscheidest / Opensource Website</title>
    <link rel="stylesheet" href="style.css">
    <!-- Marked.js für Markdown → HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="content-wrapper">

    <!-- YOU DECIDE -->
    <div class="accordion-wrapper" data-folder="02 exhibition">
        <h1 class="accordion"></h1>
        <div class="panel" data-readme-url="https://raw.githubusercontent.com/technorama-ssc/you-decide/main/02%20exhibition/README.md">
            <!-- Inhalt wird dynamisch geladen -->
        </div>
    </div>

    <!-- SYSTEM -->
    <div class="accordion-wrapper" data-folder="01 system">
        <h1 class="accordion"></h1>
        <div class="panel" data-readme-url="https://raw.githubusercontent.com/technorama-ssc/you-decide/main/01%20system/README.md">
            <!-- Inhalt wird dynamisch geladen -->
        </div>
    </div>

    <!-- EXHIBITS -->
    <div class="accordion-wrapper" data-folder="03 exhibits">
        <h1 class="accordion"></h1>
        <div class="panel" data-readme-url="https://raw.githubusercontent.com/technorama-ssc/you-decide/main/03%20exhibits/README.md">
            <!-- Inhalt wird dynamisch geladen -->
        </div>
    </div>

</div>

<script>
var acc = document.getElementsByClassName("accordion");

// Setze Akkordeon-Titel aus Ordnernamen
for (let i = 0; i < acc.length; i++) {
    let wrapper = acc[i].parentElement;
    let folderName = wrapper.dataset.folder;
    acc[i].textContent = folderName.toUpperCase();
}

// Funktion: Markdown von GitHub laden und ins Panel einfügen
async function loadReadme(panel) {
    if (panel.dataset.loaded) return; // Nur einmal laden
    const url = panel.dataset.readmeUrl;
    try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Fehler beim Laden der README");
        let markdown = await response.text();

        // Entferne erste H1-Überschrift, weil Titel vom Ordner kommt
        markdown = markdown.replace(/^# .*\n/, '');

        panel.innerHTML = marked.parse(markdown);
        panel.dataset.loaded = "true"; // markieren, dass geladen
    } catch (err) {
        panel.innerHTML = "<p style='color:red;'>Fehler beim Laden des Inhalts</p>";
        console.error(err);
    }
}

// Akkordeon-Funktion
for (var i = 0; i < acc.length; i++) {
    acc[i].addEventListener("click", async function() {
        var wrapper = this.parentElement;
        var panel = this.nextElementSibling;

        // Alle Panels schließen
        for (var j = 0; j < acc.length; j++) {
            var otherWrapper = acc[j].parentElement;
            var otherPanel = acc[j].nextElementSibling;
            if (otherWrapper !== wrapper) {
                otherPanel.style.display = "none";
                otherWrapper.style.backgroundColor = "transparent";
                acc[j].style.color = "#666666";
                otherPanel.style.color = "#ffffff";
            }
        }

        // Aktuelles Panel öffnen oder schließen
        if (panel.style.display === "block") {
            panel.style.display = "none";
            wrapper.style.backgroundColor = "transparent";
            this.style.color = "#666666";
            panel.style.color = "#ffffff";
        } else {
            panel.style.display = "block";
            wrapper.style.backgroundColor = "#eaff00";
            this.style.color = "#000000";
            panel.style.color = "#000000";

            // README dynamisch laden
            await loadReadme(panel);
        }
    });
}
</script>

</body>
</html>
