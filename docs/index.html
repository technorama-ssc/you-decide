<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Du entscheidest / Opensource Website</title>
    <link rel="stylesheet" href="style.css"> 
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head> 
<body>

<div class="content-wrapper">

    <!-- YOU DECIDE -->
    <div class="accordion-wrapper">
        <h1 class="accordion">YOU DECIDE</h1>
        <div class="panel" data-folder="02%20exhibition"></div>
    </div>

    <!-- SYSTEM -->
    <div class="accordion-wrapper">
        <h1 class="accordion">SYSTEM</h1>
        <div class="panel" data-folder="01%20system"></div>
    </div>

    <!-- EXHIBITS -->
    <div class="accordion-wrapper">
        <h1 class="accordion">EXHIBITS</h1>
        <div class="panel" data-folder="03%20exhibits"></div>
    </div>

</div>

<script>
var acc = document.getElementsByClassName("accordion");

/* ------------------------------------------
   1. README + Auto-Bilder aus Ordner laden
------------------------------------------- */
async function loadPanel(panel, titleElement) {
    if (panel.dataset.loaded === "true") return;

    const folder = panel.dataset.folder;

    const baseRaw = `https://raw.githubusercontent.com/technorama-ssc/you-decide/main/${folder}`;
    const baseHtml = `https://github.com/technorama-ssc/you-decide/tree/main/${folder}`;

    /* ---- README laden ---- */
    try {
        const readmeResponse = await fetch(`${baseRaw}/README.md`);
        let markdown = await readmeResponse.text();

        let lines = markdown.split("\n");
        if (lines[0].startsWith("# ")) {
            titleElement.textContent = lines[0].replace("# ","").toUpperCase();
            lines.shift();
        }

        panel.innerHTML = marked.parse(lines.join("\n"));

    } catch (e) {
        panel.innerHTML = "<p style='color:red;'>README konnte nicht geladen werden.</p>";
    }

    /* ---- Bilddateien automatisch finden ---- */
    try {
        const htmlIndex = await fetch(baseHtml);
        const htmlText = await htmlIndex.text();

        const imageRegex = /href="([^"]+\.(png|jpg|jpeg|gif))"/gi;
        let match;

        while ((match = imageRegex.exec(htmlText)) !== null) {
            const filename = match[1].split("/").pop();
            const url = `${baseRaw}/${filename}`;

            const img = document.createElement("img");
            img.src = url;
            img.onerror = () => img.remove(); // nie broken image
            panel.appendChild(img);
        }
    } catch (e) {
        console.error("Fehler beim Bilderfinden:", e);
    }

    panel.dataset.loaded = "true";
}

/* ------------------------------------------
   2. Akkordeon-Logik
------------------------------------------- */
for (let i = 0; i < acc.length; i++) {
    acc[i].addEventListener("click", async function() {
        const wrapper = this.parentElement;
        const panel = this.nextElementSibling;

        // andere schließen
        for (let j = 0; j < acc.length; j++) {
            const otherWrapper = acc[j].parentElement;
            const otherPanel = acc[j].nextElementSibling;

            if (otherWrapper !== wrapper) {
                otherPanel.style.display = "none";
                otherWrapper.style.backgroundColor = "transparent";
                acc[j].style.color = "#666666";
                otherPanel.style.color = "#ffffff";
            }
        }

        // aktuelles öffnen/schließen
        if (panel.style.display === "block") {
            panel.style.display = "none";
            wrapper.style.backgroundColor = "transparent";
            this.style.color = "#666666";
            panel.style.color = "#ffffff";
        } else {
            panel.style.display = "block";
            wrapper.style.backgroundColor = "#eaff00";
            this.style.color = "#000000";
            panel.style.color = "#000000";
            await loadPanel(panel, this);
        }
    });
}
</script>

</body>
</html>
